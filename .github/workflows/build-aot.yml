name: Build Native AOT

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-aot:
    name: Build Native AOT (Windows x64)
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Dependencies
        run: dotnet restore PixelCatcher/PixelCatcher.sln

      - name: Publish Native AOT
        run: >
          dotnet publish PixelCatcher/PixelCatcher/PixelCatcher.csproj
          -c Release
          -f net10.0-windows
          -r win-x64
          -o ./publish/aot

      - name: Copy Sprites to Publish Directory
        shell: pwsh
        run: |
          if (Test-Path "PixelCatcher/PixelCatcher/Sprites") {
            Copy-Item -Path "PixelCatcher/PixelCatcher/Sprites" -Destination "./publish/aot/Sprites" -Recurse -Force
          }

      - name: Create ZIP Package
        shell: pwsh
        run: |
          Compress-Archive -Path "./publish/aot/*" -DestinationPath "./PixelCatcher-win-x64-NativeAOT.zip" -Force

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PixelCatcher-win-x64-NativeAOT
          path: PixelCatcher-win-x64-NativeAOT.zip
          retention-days: 30

      - name: Create or Update GitHub Release
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=$(grep -oP '(?<=AssemblyVersion\(")[^"]*' PixelCatcher/PixelCatcher/Properties/AssemblyInfo.cs)
          TAG="v${TAG:-0.7.0.0}"
          echo "Target release tag: $TAG"
          gh auth status
          if gh release view "$TAG" --repo "${{ github.repository }}" > /dev/null 2>&1; then
            echo "Release $TAG exists. Uploading updated asset..."
            gh release upload "$TAG" "PixelCatcher-win-x64-NativeAOT.zip" --repo "${{ github.repository }}" --clobber
          else
            echo "Creating new GitHub Release $TAG..."
            gh release create "$TAG" "PixelCatcher-win-x64-NativeAOT.zip" \
              --repo "${{ github.repository }}" \
              --title "PixelCatcher $TAG" \
              --notes "PixelCatcher $TAG - Native AOT standalone binary (Windows x64)."
          fi
