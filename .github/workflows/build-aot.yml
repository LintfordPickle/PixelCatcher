name: Build Native AOT

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-aot:
    name: Build Native AOT (Windows x64)
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Dependencies
        run: dotnet restore PixelCatcher/PixelCatcher.sln

      - name: Publish Native AOT
        run: >
          dotnet publish PixelCatcher/PixelCatcher/PixelCatcher.csproj
          -c Release
          -f net10.0-windows
          -r win-x64
          -o ./publish/aot

      - name: Copy Sprites to Publish Directory
        shell: pwsh
        run: |
          if (Test-Path "PixelCatcher/PixelCatcher/Sprites") {
            Copy-Item -Path "PixelCatcher/PixelCatcher/Sprites" -Destination "./publish/aot/Sprites" -Recurse -Force
          }

      - name: Create ZIP Package
        shell: pwsh
        run: |
          Compress-Archive -Path "./publish/aot/*" -DestinationPath "./PixelCatcher-win-x64-NativeAOT.zip" -Force

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PixelCatcher-win-x64-NativeAOT
          path: PixelCatcher-win-x64-NativeAOT.zip
          retention-days: 30

      - name: Create or Update GitHub Release
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          $content = Get-Content "PixelCatcher/PixelCatcher/Properties/AssemblyInfo.cs" -Raw
          if ($content -match '(?m)^\s*\[assembly:\s*AssemblyVersion\("([^"]+)"\)\]') {
            $tag = "v$($matches[1])"
          } else {
            $tag = "v0.7.1.0"
          }
          Write-Host "Publishing GitHub Release for $tag..."

          gh auth status

          $null = gh release view $tag --repo $env:GH_REPO 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag already exists. Updating asset..."
            gh release upload $tag "PixelCatcher-win-x64-NativeAOT.zip" --repo $env:GH_REPO --clobber
          } else {
            Write-Host "Creating new GitHub Release $tag..."
            gh release create $tag "PixelCatcher-win-x64-NativeAOT.zip" `
              --repo $env:GH_REPO `
              --title "PixelCatcher $tag" `
              --notes "PixelCatcher $tag - Native AOT standalone binary (Windows x64)."
          }
