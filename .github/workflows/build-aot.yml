name: Build Native AOT

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-aot:
    name: Build Native AOT (Windows x64)
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Dependencies
        run: dotnet restore PixelCatcher/PixelCatcher.sln

      - name: Publish Native AOT
        run: >
          dotnet publish PixelCatcher/PixelCatcher/PixelCatcher.csproj
          -c Release
          -f net10.0-windows
          -r win-x64
          -o ./publish/aot

      - name: Copy Sprites to Publish Directory
        shell: pwsh
        run: |
          if (Test-Path "PixelCatcher/PixelCatcher/Sprites") {
            Copy-Item -Path "PixelCatcher/PixelCatcher/Sprites" -Destination "./publish/aot/Sprites" -Recurse -Force
          }

      - name: Create ZIP Package
        shell: pwsh
        run: |
          Compress-Archive -Path "./publish/aot/*" -DestinationPath "./PixelCatcher-win-x64-NativeAOT.zip" -Force

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PixelCatcher-win-x64-NativeAOT
          path: PixelCatcher-win-x64-NativeAOT.zip
          retention-days: 30

      - name: Create or Update GitHub Release
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "=== Auth Status ==="
            gh auth status
            echo "=== Ref Info ==="
            echo "GITHUB_REF: $GITHUB_REF"
            echo "GITHUB_REPOSITORY: $GITHUB_REPOSITORY"
            TAG="v0.7.0.0"
            echo "Target Tag: $TAG"
            echo "=== Create Release ==="
            gh release create "$TAG" "PixelCatcher-win-x64-NativeAOT.zip" \
              --repo "$GITHUB_REPOSITORY" \
              --title "PixelCatcher $TAG" \
              --notes "PixelCatcher $TAG - Native AOT standalone binary (Windows x64)."
          } > release_diag.log 2>&1

      - name: Upload Diagnostic Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-diagnostic-log
          path: release_diag.log
