name: Build Native AOT

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-aot:
    name: Build Native AOT (Windows x64)
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Dependencies
        run: dotnet restore PixelCatcher/PixelCatcher.sln

      - name: Publish Native AOT
        run: >
          dotnet publish PixelCatcher/PixelCatcher/PixelCatcher.csproj
          -c Release
          -f net10.0-windows
          -r win-x64
          -o ./publish/aot

      - name: Copy Sprites to Publish Directory
        shell: pwsh
        run: |
          if (Test-Path "PixelCatcher/PixelCatcher/Sprites") {
            Copy-Item -Path "PixelCatcher/PixelCatcher/Sprites" -Destination "./publish/aot/Sprites" -Recurse -Force
          }

      - name: Create ZIP Package
        shell: pwsh
        run: |
          Compress-Archive -Path "./publish/aot/*" -DestinationPath "./PixelCatcher-win-x64-NativeAOT.zip" -Force

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PixelCatcher-win-x64-NativeAOT
          path: PixelCatcher-win-x64-NativeAOT.zip
          retention-days: 30

      - name: Extract Version
        id: get_version
        shell: pwsh
        run: |
          $content = Get-Content "PixelCatcher/PixelCatcher/Properties/AssemblyInfo.cs" -Raw
          if ($content -match 'AssemblyVersion\("([^"]+)"\)') {
            $ver = $matches[1]
          } else {
            $ver = "0.7.0.0"
          }
          Write-Host "Detected version: $ver"
          "version=$ver" >> $env:GITHUB_OUTPUT
          "tag=v$ver" >> $env:GITHUB_OUTPUT

      - name: Create or Update GitHub Release
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ steps.get_version.outputs.tag }}
          name: PixelCatcher ${{ steps.get_version.outputs.tag }}
          files: PixelCatcher-win-x64-NativeAOT.zip
          draft: false
          prerelease: false
          generate_release_notes: true
